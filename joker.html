<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>电子设备转接工理论考试 - 在线答题</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.7;padding:24px 16px 60px;min-height:100vh}
.wrap{max-width:800px;margin:0 auto}

.site-header{text-align:center;margin-bottom:22px}
.site-header h1{font-size:22px;font-weight:700;letter-spacing:.5px}
.site-header .subtitle{font-size:13.5px;color:#64748b;margin-top:4px}

.card{background:#fff;border-radius:16px;padding:28px 26px 24px;box-shadow:0 6px 28px rgba(15,23,42,.07);animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 筛选面板 */
.filter-panel{background:#fff;border-radius:16px;padding:26px 24px;box-shadow:0 6px 28px rgba(15,23,42,.07);margin-bottom:18px;display:none}
.filter-panel.show{display:block}
.filter-panel h3{font-size:17px;margin-bottom:10px}
.total-info{font-size:14px;color:#64748b;margin-bottom:14px}
.total-info b{color:#2563eb}
.filter-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.filter-row label{font-size:14px;font-weight:600;color:#334155}
.filter-row input[type="text"]{flex:1;min-width:200px;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;outline:none;font-family:inherit}
.filter-row input[type="text"]:focus{border-color:#2563eb}
.filter-actions{display:flex;gap:10px;flex-wrap:wrap}
.filter-preview{font-size:13px;color:#64748b;margin-top:12px;max-height:130px;overflow-y:auto;background:#f8fafc;padding:10px 14px;border-radius:8px}
.filter-preview .item{padding:1px 0}
.filter-preview .item b{color:#2563eb}

/* 按钮 */
.btn{padding:9px 20px;border:none;border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:#2563eb;color:#fff}
.btn.primary:hover{background:#1d4ed8}
.btn.ghost{background:#e2e8f0;color:#334155}
.btn.ghost:hover{background:#cbd5e1}

/* 进度条 */
.topbar{margin-bottom:14px;display:none}
.topbar.show{display:block}
.progress-row{display:flex;justify-content:space-between;font-size:13.5px;color:#64748b;margin-bottom:8px;flex-wrap:wrap;gap:6px}
.progress-row b{color:#2563eb}
.link-btn{background:none;border:none;color:#2563eb;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:underline;padding:0 0 0 12px}
.link-btn:hover{color:#1d4ed8}
.progress-bar{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden}
.progress-bar>div{height:100%;width:0;background:linear-gradient(90deg,#60a5fa,#2563eb);border-radius:999px;transition:width .35s}

/* 题目 */
.q-head{margin-bottom:12px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:#eff6ff;color:#2563eb}
.badge.multi{background:#fff7ed;color:#c2410c}
.badge.judge{background:#f0fdf4;color:#16a34a}
.q-stem{font-size:17px;font-weight:600;line-height:1.85;margin-bottom:20px;white-space:pre-wrap;word-break:break-word}
.options{display:flex;flex-direction:column;gap:10px}
.option{display:flex;align-items:flex-start;gap:12px;width:100%;padding:13px 16px;border:1.5px solid #e2e8f0;border-radius:10px;background:#fff;color:inherit;font-family:inherit;font-size:15.5px;line-height:1.65;text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.option:hover:not(:disabled){border-color:#93c5fd;background:#f8fbff}
.option.selected{border-color:#2563eb;background:#eff6ff}
.option.correct{border-color:#16a34a;background:#f0fdf4}
.option.wrong{border-color:#dc2626;background:#fef2f2}
.option:disabled{cursor:default;opacity:1}
.option .key{flex:0 0 26px;height:26px;line-height:26px;margin-top:1px;text-align:center;border-radius:6px;background:#f1f5f9;font-size:13px;font-weight:700;color:#475569}
.option.selected .key{background:#2563eb;color:#fff}
.option.correct .key{background:#16a34a;color:#fff}
.option.wrong .key{background:#dc2626;color:#fff}
.option .text{flex:1}

.feedback{margin-top:20px;padding:16px 18px;border-radius:12px;font-size:15px}
.feedback.ok{background:#f0fdf4;border:1px solid #bbf7d0}
.feedback.no{background:#fef2f2;border:1px solid #fecaca}
.fb-title{font-weight:700;margin-bottom:6px}
.feedback.ok .fb-title{color:#15803d}
.feedback.no .fb-title{color:#b91c1c}
.fb-line{color:#334155}
.fb-line b{color:#0f172a}

.footer{display:flex;justify-content:flex-end;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn-lg{padding:10px 26px;border:none;border-radius:10px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s,transform .1s}
.btn-lg:active:not(:disabled){transform:scale(.98)}
.btn-lg.primary{background:#2563eb;color:#fff}
.btn-lg.primary:hover:not(:disabled){background:#1d4ed8}
.btn-lg.primary:disabled{background:#cbd5e1;cursor:not-allowed}
.btn-lg.ghost{background:#f1f5f9;color:#475569}
.btn-lg.ghost:hover{background:#e2e8f0}

/* 成绩页 */
.result{text-align:center;padding:12px 0 6px}
.score-num{font-size:60px;font-weight:800;color:#2563eb;line-height:1.1;letter-spacing:-2px}
.score-num span{font-size:24px;font-weight:700;margin-left:2px}
.score-sub{color:#64748b;margin-top:8px;font-size:15px}
.score-sub b{color:#1e293b}
.review-title{margin:26px 0 12px;font-size:15px;font-weight:700;color:#334155;padding-left:10px;border-left:3px solid #2563eb}
.review-item{padding:14px 16px;background:#f8fafc;border-radius:10px;margin-bottom:10px;font-size:14.5px}
.review-stem{font-weight:600;margin-bottom:6px}
.review-line{color:#64748b;font-size:14px}
.review-line .green{color:#16a34a}
.review-line .red{color:#dc2626}
.all-right{text-align:center;padding:30px 0;color:#16a34a;font-weight:600;font-size:16px}

@media(max-width:480px){
  .card{padding:22px 18px 18px;border-radius:14px}
  .q-stem{font-size:16px}
  .option{font-size:15px;padding:12px 13px}
  .score-num{font-size:48px}
  .site-header h1{font-size:19px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="site-header">
    <h1>电子设备转接工 · 在线答题</h1>
    <p class="subtitle">选择题号范围，开始练习</p>
  </header>

  <div class="card" id="emptyTip" style="display:none;">
    <p style="text-align:center;color:#dc2626;padding:30px 0;font-size:15px;">题库加载失败，请联系管理员。</p>
  </div>

  <!-- 题号筛选面板 -->
  <div class="filter-panel" id="filterPanel">
    <h3>🔢 选择题号范围</h3>
    <div class="total-info">当前题库共 <b id="allTotal">0</b> 道题。</div>
    <div class="filter-row">
      <label for="rangeInput">题号：</label>
      <input type="text" id="rangeInput" placeholder="例如：1-50 或 1,3,5-10,20">
    </div>
    <div class="filter-actions">
      <button class="btn primary" id="startBtn">开始答题</button>
      <button class="btn ghost" id="allBtn">全部题目</button>
      <button class="btn ghost" id="choiceBtn">只做选择题</button>
      <button class="btn ghost" id="judgeBtn">只做判断题</button>
    </div>
    <div class="filter-preview" id="filterPreview"></div>
  </div>

  <!-- 进度条 -->
  <div class="topbar" id="topbar">
    <div class="progress-row">
      <span>第 <b id="cur">1</b> / <b id="total">0</b> 题</span>
      <span>
        答对 <b id="rightCount">0</b> 题
        <button class="link-btn" id="backToFilter">重新选题</button>
      </span>
    </div>
    <div class="progress-bar"><div id="bar"></div></div>
  </div>

  <!-- 答题卡片 -->
  <div class="card" id="card"></div>
</div>


<!-- ============================================================
     管理员编辑区（组员不需要改动这里）
     ------------------------------------------------------------
     把题库文本粘贴到下方 bankData 标签内部即可。
     格式要求：
       · 每题以「数字. 」开头，例如：1. 题目内容（  ）。
       · 选项每行一个，例如：A. 内容
       · 答案单独一行，例如：答案：D  或  答案：ACD  或  答案：√
       · 题目之间空一行即可。
     保存后发给组员，他们打开即答题，无法看到或修改题库。
     ============================================================ -->
<script type="text/plain" id="bankData">
1. 无线电波传播的方向是（  ）。
A. 沿与其电场一致的方向
B. 沿与其磁场一致的方向
C. 沿与其电场和磁场都平行的方向
D. 沿与其电场和磁场都垂直的方向
答案：D

2. 无线电波的传播速度为（  ）。
A. 3×10^8 m/s
B. 340 m/s
C. 100 km/s
D. 34 km/s
答案：A

3. 无线电频率的上限一般为（  ）。
A. 3 GHz
B. 30 GHz
C. 300 GHz
D. 3000 GHz
答案：D

4. 短波波长范围为（  ）。
A. 1000~100m
B. 100~10m
C. 10~1m
D. 10~1dm
答案：B

5. 频率范围在30～300MHz的无线电波称为（  ）。
A. 长波
B. 中波
C. 短波
D. 超短波
答案：D

6. 沿着地球表面传播的无线电波称为（  ）。
A. 天波
B. 地波
C. 直射波
D. 微波
答案：B

7. 超短波和微波的传播特性是（  ）。
A. 能绕射
B. 能被电离层反射
C. 只能做直线传播
D. 适合用地波传播
答案：C

8. 属于低频信号的是（  ）。
A. 调制信号
B. 载波信号
C. 无线电波
D. 已调波信号
答案：A

9. 调制信号的频率（  ）载波的频率。
A. 低于
B. 等于
C. 高于
D. 两者无关
答案：A

10. 如下图所示为用示波器测量正弦波波形的画面，若“VOLTS／DIV”的指示值是2V，则所测正弦波的峰值为（  ）。
A. 9.2V
B. 4.6V
C. 6.5V
D. 3.25V
答案：A

11. 下图所示用示波器测量正弦波波形的画面中，若“TIME／DIV”的指示值是5μs，则所测正弦波的频率为（  ）。
A. 100 kHz
B. 50 kHz
C. 25 kHz
D. 20 kHz
答案：B

12. 示波器的显示方式开关按钮在“YA+YB”上，此时示波器（  ）。
A. 同时显示YA和YB两个信号
B. 显示YA
C. 显示YB
D. 显示的是YA与YB相加后的一个波形
答案：B

13. 用万用表测量正弦交流信号时，其测量结果是（  ）。
A. 有效值
B. 最大值
C. 平均值
D. 与平均值成正比的量
答案：D

14. 用万用表测量非正弦交流信号时，其测量结果是（  ）。
A. 有效值
B. 最大值
C. 平均值
D. 与平均值成正比的量
答案：A

15. 某信号由2kHz／5V、2kHz／3V和2kHz／2V三个信号合成，其频谱中包含（  ）。
A. 1项
B. 2项
C. 3项
D. 4项
答案：D

16. 下列说法中表达正确的是（  ）。
A. 低频信号可直接从天线有效地辐射
B. 低频信号必须装载到高频信号上才能从天线有效地辐射
C. 高频信号及低频信号都不能从天线有效地辐射
D. 高频信号及低频信号都能从天线有效地辐射
答案：B

17. 为了有效地辐射电磁波，天线尺寸必须与（  ）为同一数量级。
A. 辐射信号的波长
B. 辐射信号的频率
C. 辐射信号的振幅
D. 辐射信号的相位
答案：A

18. 天线的增益大小可以说明（  ）。
A. 天线对高频电信号的放大能力
B. 天线在某个方向上对电磁波的收集或发射能力
C. 天线对电磁波的放大能力
D. 天线在所有方向上对电磁波的收集或发射能力
答案：B

19. 半波振子的输入阻抗约为（  ）。
A. 50 Ω
B. 73 Ω
C. 150 Ω
D. 300 Ω
答案：B

20. 常用的同轴传输线的特性阻抗为（  ）。
A. 40 Ω
B. 75 Ω
C. 150 Ω
D. 225 Ω
答案：B

21. 无线电工程中，常用的单位有dBμv、dBm等，dBm是（  ）单位。
A. 电压
B. 功率
C. 增益
D. 电流
答案：B

22. 要使天线能从馈线得到最大功率，就必须使天线和馈线有良好的（  ）。
A. 感抗匹配
B. 阻抗匹配
C. 特性匹配
D. 容抗匹配
答案：B

23. 交流电路中，电阻两端的电压与通过它的电流相比（  ）。
A. 超前90°
B. 滞后90°
C. 同相位
D. 超前180°
答案：C

24. 在交流电的一个周期中，纯电感电路的电流相位比电压相位（  ）。
A. 滞后90°
B. 超前90°
C. 滞后180°
D. 超前180°
答案：A

25. LC串联谐振时，电路中的电流（  ）。
A. 最大
B. 最小
C. 不变
D. 不确定
答案：A

26. LC串联谐振时，电路中的总阻抗（  ）。
A. 最大
B. 最小
C. 不变
D. 不确定
答案：B

27. LC串联谐振又称为（  ）。
A. 电压谐振
B. 电流谐振
C. 固有频率谐振
D. 电感谐振
答案：A

28. LC串联谐振电路处于谐振状态时，交流信号源频率升高，电路将呈现出（  ）。
A. 电阻性
B. 电感性
C. 电容性
D. 不确定性
答案：B

29. LC并联谐振时，电路中的总电流（  ）。
A. 最大
B. 最小
C. 不变
D. 不确定
答案：B

30. LC并联谐振时，电路中的总阻抗（  ）。
A. 最大
B. 最小
C. 不变
D. 不确定
答案：A

31. LC并联谐振又称为（  ）。
A. 电压谐振
B. 电流谐振
C. 固有频率谐振
D. 电容谐振
答案：B

32. 并联谐振电路的谐振频率近似为（  ）。
A. 1/√LC
B. √LC
C. 2π√LC
D. 1/(2π√LC)
答案：D

33. LC并联谐振电路处于谐振状态时，交流信号源频率升高，电路将呈现出（  ）。
A. 电阻性
B. 电感性
C. 电容性
D. 不确定性
答案：C

34. 串联谐振和并联谐振的共同点是发生谐振时感抗（  ）。
A. 小于容抗
B. 等于容抗
C. 大于容抗
D. 与容抗无关
答案：B

35. LC回路并联谐振时，电容电流的相位与总电流的相位的关系是（  ）。
A. 电容上的电流相位超前总电流90°
B. 电容上的电流相位滞后总电流90°
C. 电容上的电流相位超前总电流180°
D. 电容上的电流相位滞后总电流180°
答案：A

36. 品质因数Q、选择性和通频带BW之间的关系是（  ）。
A. Q=BWf0
B. Q=f0/BW
C. Q=f0·BW
D. Q=f0+BW
答案：B

37. 在串联谐振电路中，只改变电阻时，电阻越大，则（  ）。
A. 电路的选择性越差
B. 电路的选择性越好
C. 电路的选择性不受电阻的影响
D. 电路的选择性保持不变
答案：A

38. 色环依次为黄、黑、金、银的电阻器，其电阻值为（  ）。
A. 40 Ω
B. 400 Ω
C. 4000 Ω
D. 4 Ω
答案：D

39. 用万用表判别电容质量时，测量挡位应置于（  ）。
A. 电阻挡
B. 电流挡
C. 直流电压挡
D. 交流电压挡
答案：A

40. 元器件引出线折弯处要求成（  ）。
A. 直角
B. 锐角
C. 钝角
D. 圆弧形
答案：D

41. 元器件装配前应（  ）。
A. 全部检验
B. 抽验
C. 免验
D. 只核对数量
答案：A

42. 在高频放大器中，多用调谐回路作为负载，其作用不包括（  ）。
A. 选出有用频率
B. 滤除谐波成分
C. 阻抗匹配
D. 产生新的频率成分
答案：D

43. 小信号调谐放大器主要用于无线通信系统的（  ）。
A. 发送设备
B. 接收设备
C. 发送设备和接收设备
D. 传输媒质
答案：B

44. 共基极截止频率fα、共射极截止频率fβ和特征频率fT三者之间的大小关系为（  ）。
A. fβ>fT>fα
B. fα>fT>fβ
C. fα>fβ>fT
答案：C

45. 小信号谐振放大器的主要技术指标不包含（  ）。
A. 电压增益
B. 失真系数
C. 通频带
D. 选择性
答案：B

46. 信号源和负载与谐振回路采取部分接入，其目的是（  ）。
A. 提高放大器的放大倍数
B. 提高回路的Q值
C. 提高矩形系数
D. 提高放大器的通频带
答案：B

47. 小信号调谐放大器主要工作在（  ）状态。
A. 甲类
B. 乙类
C. 甲乙类
D. 丙类
答案：A

48. 小信号单调谐放大器的通频带是指其电压增益下降到谐振时的（  ）时所对应的频率范围，用2Δf0.7表示。
A. 1/2
B. 1/3
C. 1/√2
D. 1/3
答案：C

49. 在小信号单调谐放大器的LC回路两端并联一个电阻R，可以（  ）。
A. 提高回路的Q值
B. 提高谐振频率
C. 加宽通频带
D. 减小通频带
答案：C

50. 在电路参数相同的情况下，双调谐回路放大器的最大电压增益与单调谐回路放大器相比（  ）。
A. 更大
B. 更小
C. 相同
D. 无法比较
答案：C

51. 理想滤波器在通带内衰减应为（  ）。
A. 0
B. 1
C. 5
D. 10
答案：A

52. 滤波器在满足传输条件时，工作在通频带内时的特性阻抗表现为（  ）。
A. 电感性
B. 电容性
C. 电阻性

<script>
/* ============================================================
   1. 文本解析器
   ============================================================ */
function parseText(text){
  const lines=text.split(/\r?\n/);
  const qs=[];let cur=null;let inOpt=false;
  const numRe=/^\s*(\d+)\s*[.、．·]\s*(.*)/;
  const optRe=/^\s*([A-Da-d])\s*[.、．·]?\s*(.*)/;
  const ansRe=/答案\s*[:：]?\s*([A-Da-d√×对错正确错误]+)/i;

  function finish(q){
    if(!q)return;
    q.stem=q.stem.replace(/\s+/g,' ').trim();
    if(q.options.length===0){
      q.type='judge';
      q.answer=q.answer.map(a=>{
        const s=String(a).trim();
        if(['√','对','正确','T','true'].includes(s))return '√';
        if(['×','错','错误','F','false'].includes(s))return '×';
        return s;
      });
    }else{
      q.type=q.answer.length>1?'multiple':'single';
    }
  }

  for(let raw of lines){
    let line=raw.trim();
    if(!line)continue;
    const n=line.match(numRe);
    if(n&&!optRe.test(line)){
      if(cur){finish(cur);qs.push(cur);}
      cur={id:parseInt(n[1]),stem:n[2]||'',options:[],answer:[],type:'single'};
      inOpt=false;continue;
    }
    if(!cur)continue;
    const am=line.match(ansRe);
    if(am){
      let s=am[1].toUpperCase();
      if(s.includes('√')||s.includes('对')||s.includes('正确'))cur.answer=['√'];
      else if(s.includes('×')||s.includes('错')||s.includes('错误'))cur.answer=['×'];
      else cur.answer=[...new Set(s.match(/[A-D]/g)||[])].sort();
      continue;
    }
    const om=line.match(optRe);
    if(om){cur.options.push({key:om[1].toUpperCase(),text:om[2].trim()});inOpt=true;continue;}
    if(inOpt&&cur.options.length)cur.options[cur.options.length-1].text+=' '+line;
    else cur.stem+=(cur.stem?' ':'')+line;
  }
  if(cur){finish(cur);qs.push(cur);}
  return qs.filter(q=>q.stem&&(q.options.length>0||q.type==='judge'));
}

/* ============================================================
   2. 加载题库
   ============================================================ */
const bankText=document.getElementById('bankData').textContent||'';
const ALL_QUESTIONS=parseText(bankText);
let QUESTIONS=[];
const state={index:0,answers:{},finished:false};
const $=id=>document.getElementById(id);

/* ============================================================
   3. 题号筛选
   ============================================================ */
function parseRangeInput(str,total){
  if(!str||!str.trim())return null;
  const parts=str.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
  const indices=new Set();
  for(let part of parts){
    let m;
    if((m=part.match(/^(\d+)\s*[-~～]\s*(\d+)$/))){
      let start=parseInt(m[1]),end=parseInt(m[2]);
      if(start>end)[start,end]=[end,start];
      for(let i=start;i<=end;i++)if(i>=1&&i<=total)indices.add(i-1);
    }else if((m=part.match(/^(\d+)$/))){
      let n=parseInt(m[1]);
      if(n>=1&&n<=total)indices.add(n-1);
    }
  }
  return [...indices].sort((a,b)=>a-b);
}

function updatePreview(){
  const total=ALL_QUESTIONS.length;
  const input=$("rangeInput").value.trim();
  if(!input){
    $("filterPreview").innerHTML='<div class="item">未输入题号，将默认练习全部题目。</div>';
    return;
  }
  const indices=parseRangeInput(input,total);
  if(!indices||!indices.length){
    $("filterPreview").innerHTML='<div class="item" style="color:#dc2626;">未匹配到有效题号，请检查输入格式。</div>';
    return;
  }
  let html=`<div class="item">共选中 <b>${indices.length}</b> 道题：</div>`;
  indices.slice(0,20).forEach(i=>{
    const q=ALL_QUESTIONS[i];
    const short=q.stem.length>30?q.stem.slice(0,30)+'…':q.stem;
    html+=`<div class="item"><b>${i+1}</b>. ${short}</div>`;
  });
  if(indices.length>20)html+=`<div class="item">… 还有 ${indices.length-20} 道题</div>`;
  $("filterPreview").innerHTML=html;
}

function applyFilter(mode){
  const total=ALL_QUESTIONS.length;
  if(!total)return;
  let indices;
  if(mode==='all'){
    indices=ALL_QUESTIONS.map((_,i)=>i);
  }else if(mode==='choice'){
    indices=ALL_QUESTIONS.map((q,i)=>q.type!=='judge'?i:-1).filter(i=>i>=0);
  }else if(mode==='judge'){
    indices=ALL_QUESTIONS.map((q,i)=>q.type==='judge'?i:-1).filter(i=>i>=0);
  }else{
    // 自定义题号
    const input=$("rangeInput").value.trim();
    if(!input){
      indices=ALL_QUESTIONS.map((_,i)=>i);
    }else{
      indices=parseRangeInput(input,total);
      if(!indices||!indices.length){alert("没有选中任何题目，请检查题号输入。");return;}
    }
  }
  QUESTIONS=indices.map(i=>ALL_QUESTIONS[i]);
  state.index=0;state.answers={};state.finished=false;
  $("filterPanel").classList.remove('show');
  $("topbar").classList.add('show');
  renderQuestion();
}

function showFilterPanel(){
  $("filterPanel").classList.add('show');
  $("topbar").classList.remove('show');
  $("allTotal").textContent=ALL_QUESTIONS.length;
  $("rangeInput").value='';
  updatePreview();
  $("card").innerHTML='<p style="text-align:center;color:#64748b;padding:30px 0;">请在上方选择题号范围，然后点击「开始答题」。</p>';
}

/* ============================================================
   4. 答题逻辑
   ============================================================ */
function getRec(i){if(!state.answers[i])state.answers[i]={selected:[],submitted:false};return state.answers[i];}
function isCorrect(q,sel){if(!sel||!sel.length||!q.answer||!q.answer.length)return false;return [...q.answer].sort().join('')===[...sel].sort().join('');}

function updateTop(){
  const total=QUESTIONS.length;if(!total)return;
  $("total").textContent=total;
  $("cur").textContent=Math.min(state.index+1,total);
  let right=0;
  QUESTIONS.forEach((q,i)=>{const r=state.answers[i];if(r&&r.submitted&&isCorrect(q,r.selected))right++;});
  $("rightCount").textContent=right;
  $("bar").style.width=(state.finished?100:(state.index/total)*100)+'%';
}

function getOptions(q){
  if(q.type==='judge')return[{key:'√',text:'正确'},{key:'×',text:'错误'}];
  return q.options;
}

function renderQuestion(){
  if(!QUESTIONS.length){
    $("card").innerHTML='<p style="text-align:center;color:#64748b;padding:30px 0;">没有题目，请重新选题。</p>';
    return;
  }
  const q=QUESTIONS[state.index];
  const rec=getRec(state.index);
  const done=rec.submitted;
  const opts=getOptions(q);
  let html=`<div class="q-head"><span class="badge ${q.type==='multiple'?'multi':q.type==='judge'?'judge':''}">${q.type==='multiple'?'多选题':q.type==='judge'?'判断题':'单选题'}</span></div>`;
  html+=`<div class="q-stem">${q.stem}</div><div class="options">`;
  opts.forEach(opt=>{
    let cls='option';
    if(!done&&rec.selected.includes(opt.key))cls+=' selected';
    if(done){if(q.answer.includes(opt.key))cls+=' correct';else if(rec.selected.includes(opt.key))cls+=' wrong';}
    html+=`<button type="button" class="${cls}" data-key="${opt.key}" ${done?'disabled':''}><span class="key">${opt.key}</span><span class="text">${opt.text}</span></button>`;
  });
  html+=`</div>`;
  if(done){
    const ok=isCorrect(q,rec.selected);
    html+=`<div class="feedback ${ok?'ok':'no'}"><div class="fb-title">${ok?'✅ 回答正确':'❌ 回答错误'}</div><div class="fb-line">正确答案：<b>${q.answer.join('')||'暂无'}</b>　|　你的答案：<b>${rec.selected.join('')||'未作答'}</b></div></div>`;
  }
  html+=`<div class="footer">`;
  if(!done)html+=`<button class="btn-lg primary" id="submitBtn" ${rec.selected.length?'':'disabled'}>提交答案</button>`;
  else if(state.index<QUESTIONS.length-1)html+=`<button class="btn-lg primary" id="nextBtn">下一题 →</button>`;
  else html+=`<button class="btn-lg primary" id="finishBtn">查看成绩</button>`;
  html+=`</div>`;
  $("card").innerHTML=html;
  updateTop();
}

function toggleOption(key){
  const q=QUESTIONS[state.index];
  const rec=getRec(state.index);
  if(rec.submitted)return;
  if(q.type==='multiple'){
    const i=rec.selected.indexOf(key);
    if(i>=0)rec.selected.splice(i,1);else rec.selected.push(key);
    rec.selected.sort();
  }else rec.selected=[key];
  renderQuestion();
}

function doSubmit(){
  const rec=getRec(state.index);
  if(!rec.selected.length)return;
  rec.submitted=true;
  renderQuestion();
}

function renderResult(){
  const total=QUESTIONS.length;
  const details=QUESTIONS.map((q,i)=>{const rec=state.answers[i]||{selected:[],submitted:false};return{q,rec,ok:rec.submitted&&isCorrect(q,rec.selected)};});
  const right=details.filter(d=>d.ok).length;
  const rate=total?Math.round(right/total*100):0;
  const wrong=details.filter(d=>!d.ok);
  let html=`<div class="result"><div class="score-num">${rate}<span>%</span></div><div class="score-sub">共 ${total} 题，答对 <b>${right}</b> 题，答错 <b>${total-right}</b> 题</div></div>`;
  if(wrong.length){
    html+=`<div class="review-title">错题回顾</div>`;
    wrong.forEach(d=>{
      html+=`<div class="review-item"><div class="review-stem">${d.q.stem}</div><div class="review-line">正确答案：<b class="green">${d.q.answer.join('')||'暂无'}</b>　|　你的答案：<b class="red">${d.rec.selected.join('')||'未作答'}</b></div></div>`;
    });
  }else html+=`<div class="all-right">🎉 全部答对，太棒了！</div>`;
  html+=`<div class="footer"><button class="btn-lg ghost" id="restartBtn">重新开始</button><button class="btn-lg ghost" id="backToFilter2">重新选题</button></div>`;
  $("card").innerHTML=html;
  updateTop();
}

function restart(){state.index=0;state.answers={};state.finished=false;renderQuestion();}

/* ============================================================
   5. 事件绑定
   ============================================================ */
$("card").addEventListener('click',e=>{
  const opt=e.target.closest('.option');
  if(opt&&!opt.disabled)return toggleOption(opt.dataset.key);
  const id=e.target.id;
  if(id==='submitBtn')doSubmit();
  else if(id==='nextBtn'){state.index++;renderQuestion();}
  else if(id==='finishBtn'){state.finished=true;renderResult();}
  else if(id==='restartBtn')restart();
  else if(id==='backToFilter2')showFilterPanel();
});

$("rangeInput").addEventListener('input',updatePreview);
$("startBtn").addEventListener('click',()=>applyFilter('custom'));
$("allBtn").addEventListener('click',()=>applyFilter('all'));
$("choiceBtn").addEventListener('click',()=>applyFilter('choice'));
$("judgeBtn").addEventListener('click',()=>applyFilter('judge'));
$("backToFilter").addEventListener('click',showFilterPanel);

/* 键盘快捷键 */
document.addEventListener('keydown',e=>{
  if(state.finished||!QUESTIONS.length)return;
  const q=QUESTIONS[state.index];
  if(!q)return;
  const rec=state.answers[state.index];
  if(rec&&rec.submitted){
    if(e.key==='Enter'){const b=$("nextBtn")||$("finishBtn");if(b)b.click();}
    return;
  }
  const k=e.key.toUpperCase();
  const valid=q.type==='judge'?['√','×']:q.options.map(o=>o.key);
  if(valid.includes(k)){e.preventDefault();toggleOption(k);}
  else if(e.key==='Enter'){e.preventDefault();const b=$("submitBtn");if(b&&!b.disabled)b.click();}
});

/* 启动 */
if(ALL_QUESTIONS.length){
  showFilterPanel();
}else{
  $("emptyTip").style.display='block';
  $("filterPanel").classList.remove('show');
}
</script>
